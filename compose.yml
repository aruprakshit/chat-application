services:
  backend:
    image: golang:1.27-alpine
    working_dir: /app
    volumes:
      - ./backend:/app
    environment:
      PORT: 9090
    ports:
      - "8080:9090"
    command: go run main.go
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat_local_only
      POSTGRES_DB: chat
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat -d chat"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
